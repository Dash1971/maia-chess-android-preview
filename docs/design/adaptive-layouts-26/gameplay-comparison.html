<style>
#maia-landscape-compare{--mc-bg:light-dark(#fafafa,#090a0b);--mc-panel:light-dark(#eeedf2,#1d1c22);--mc-text:light-dark(#1d1c21,#e8e4ed);--mc-muted:light-dark(#605d67,#aaa5b0);--mc-active:light-dark(#e9def8,#3d334d);--mc-border:light-dark(#c6c3ca,#302d34);font-family:Roboto,Arial,sans-serif;display:grid;gap:26px;color:var(--mc-text)}
#maia-landscape-compare *{box-sizing:border-box}
#maia-landscape-compare h3{font-size:15px;font-weight:500;margin:0 0 12px;color:light-dark(#35303c,#d5cddf)}
#maia-landscape-compare .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
#maia-landscape-compare .label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:light-dark(#47414e,#c3bbcf)}
#maia-landscape-compare .label strong{font-weight:500}
#maia-landscape-compare .size{font-size:12px;white-space:nowrap;color:light-dark(#665e70,#b4aabe);font-variant-numeric:tabular-nums}
#maia-landscape-compare .stage{padding:10px;border-radius:12px}
#maia-landscape-compare .device{position:relative;background:var(--mc-bg);color:var(--mc-text);border:3px solid var(--mc-border);border-radius:13px;overflow:hidden;width:100%;aspect-ratio:844 / 390;container-type:inline-size}
#maia-landscape-compare .tablet{aspect-ratio:1280 / 800}
#maia-landscape-compare .region{position:absolute;min-width:0;min-height:0}
#maia-landscape-compare .bar{display:flex;align-items:center;justify-content:space-between}
#maia-landscape-compare .icons{display:flex;align-items:center;justify-content:space-around;gap:5px}
#maia-landscape-compare .glyph{display:flex;align-items:center;justify-content:center;min-width:22px;min-height:22px;flex-shrink:0}
#maia-landscape-compare .glyph svg{width:15px;height:15px;stroke-width:1.7}
#maia-landscape-compare .board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;isolation:isolate}
#maia-landscape-compare .sq{position:relative;background:#f0d9b5;aspect-ratio:1;display:flex;align-items:center;justify-content:center;min-width:0}
#maia-landscape-compare .sq.dark{background:#b58863}
#maia-landscape-compare .sq.last{background:#cdd16a}
#maia-landscape-compare .sq.dark.last{background:#aaa23a}
#maia-landscape-compare .sq img{display:block;width:100%;height:100%;pointer-events:none}
#maia-landscape-compare .player{display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:11px;line-height:1.15;white-space:nowrap}
#maia-landscape-compare .player-name{display:flex;gap:4px;align-items:center;min-width:0;flex:1}
#maia-landscape-compare .player-name .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#maia-landscape-compare .clock{flex-shrink:0}
#maia-landscape-compare .clock{border-radius:4px;background:#343735;color:#c0c2c1;padding:2px 5px;font-size:13px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
#maia-landscape-compare .active .clock{background:#f0f0f0;color:#111}
#maia-landscape-compare .proposed .clock{font-size:16px;padding:4px 8px;background:var(--mc-panel);color:var(--mc-muted)}
#maia-landscape-compare .proposed .active .clock{background:var(--mc-active);color:var(--mc-text)}
#maia-landscape-compare .dot{width:7px;height:7px;background:#18171c;border:1px solid #8f8996;border-radius:50%;flex-shrink:0}
#maia-landscape-compare .dot.white{background:#f2f0f5}
#maia-landscape-compare .moves{display:flex;align-items:center;justify-content:space-around;gap:3px;background:var(--mc-panel);border-radius:3px;padding:3px 5px;font-size:11px;white-space:nowrap}
#maia-landscape-compare .number{color:var(--mc-muted)}
#maia-landscape-compare .chosen{background:var(--mc-active);border-radius:3px;padding:3px 5px}
#maia-landscape-compare .status{font-size:11px;line-height:1;color:var(--mc-muted);display:flex;align-items:center}
#maia-landscape-compare .controls{display:flex;align-items:center;gap:4px}
#maia-landscape-compare .nav{display:flex;align-items:center;justify-content:space-around;flex:1;height:100%;background:var(--mc-panel);border-radius:7px;min-width:0}
#maia-landscape-compare .dim{opacity:.35}
#maia-landscape-compare .move-list{display:grid;grid-template-columns:24px 1fr 1fr;grid-template-rows:repeat(5,minmax(0,1fr));align-items:center;gap:2px;font-size:11px;line-height:1.25;background:var(--mc-panel);border-radius:4px;padding:5px}
#maia-landscape-compare .move-list span{padding:3px}
#maia-landscape-compare .tablet .glyph{min-width:16px;min-height:16px}
#maia-landscape-compare .tablet .glyph svg{width:13px;height:13px}
#maia-landscape-compare .gesture{position:absolute;width:12%;height:2px;bottom:3px;left:44%;background:var(--mc-muted);opacity:.6;border-radius:2px}
#maia-landscape-compare .device .board-region{display:flex;align-items:center;justify-content:center}
#maia-landscape-compare .device .board-region .board{width:100%}
@media(min-width:1100px){#maia-landscape-compare .player{font-size:12px}#maia-landscape-compare .clock{font-size:15px}#maia-landscape-compare .proposed .clock{font-size:18px}#maia-landscape-compare .moves,#maia-landscape-compare .move-list,#maia-landscape-compare .status{font-size:12px}}
@media(max-width:790px){#maia-landscape-compare .pair{grid-template-columns:1fr;gap:18px}#maia-landscape-compare .glyph svg{width:17px;height:17px}#maia-landscape-compare .glyph{min-width:24px;min-height:24px}}
@media(max-width:430px){#maia-landscape-compare .stage{padding:4px}#maia-landscape-compare .device{aspect-ratio:1.55}#maia-landscape-compare .tablet{aspect-ratio:1.35}#maia-landscape-compare .clock{padding:2px 3px;font-size:11px}#maia-landscape-compare .proposed .clock{padding:3px 5px;font-size:13px}#maia-landscape-compare .player-name .dot{display:none}#maia-landscape-compare .moves{gap:2px;padding:2px}#maia-landscape-compare .moves .older{display:none}#maia-landscape-compare .move-list{grid-template-columns:18px 1fr 1fr;padding:3px}#maia-landscape-compare .glyph{min-width:18px;min-height:18px}#maia-landscape-compare .glyph svg{width:13px;height:13px}}
</style>

<script>
(() => {
  const root=document.getElementById('maia-landscape-compare');
  const pieces=JSON.parse(document.getElementById('maia-comparison-pieces').textContent);
  const state={orientation:'White',appearance:'System'};
  const applySaved=s=>{if(s&&['White','Black'].includes(s.orientation))state.orientation=s.orientation;if(s&&['System','Dark','Light'].includes(s.appearance))state.appearance=s.appearance;};
  applySaved(window.openai?.widgetState?.modelContent?.landscapeComparison);
  const position=[];
  'r1bq1rk1/2pnbppp/p2p1n2/1p2p3/3PP3/1BP2N1P/PP3PP1/RNBQR1K1'.split('/').forEach(r=>{for(const c of r){if(/\d/.test(c))position.push(...Array(Number(c)).fill(''));else position.push(c);}});
  const icon=(name,label,dim=false)=>`<span class="glyph ${dim?'dim':''}" role="img" aria-label="${label}"><i data-lucide="${name}" aria-hidden="true"></i></span>`;
  const player=(white,clock)=>`<span class="player-name" data-tooltip="${white?'You':'Maia 1600'}"><span class="dot ${white?'white':''}"></span><span class="name">${white?'You':'Maia 1600'}</span></span><span class="clock">${clock}</span>`;
  const moves='<span class="number older">9.</span><span class="older">h3</span><span class="older">Nb8</span><span class="number">10.</span><span>d4</span><span class="chosen">Nbd7</span>';
  const controls=()=>`${icon('menu','Game menu')}${icon('flag','Resign')}<span class="nav">${icon('chevron-left','Previous move')}${icon('chevron-right','Next move',true)}</span>`;
  function region(device,cls,x,y,w,h,html){
    const W=Number(device.dataset.width),H=Number(device.dataset.height);
    const el=document.createElement('div');el.className='region '+cls;
    Object.assign(el.style,{left:(100*x/W)+'%',top:(100*y/H)+'%',width:(100*w/W)+'%',height:(100*h/H)+'%'});
    el.innerHTML=html;device.appendChild(el);return el;
  }
  root.querySelectorAll('.device').forEach(device=>{
    const W=Number(device.dataset.width),H=Number(device.dataset.height),tablet=device.classList.contains('tablet');
    if(device.dataset.layout==='existing'){
      const toolbar=56,bodyHeight=H-toolbar;
      const size=Math.min(560,Math.max(80,Math.min(bodyHeight-16-88,W*.5)));
      const col=Math.max(size,240),bx=8+(col-size)/2,top=toolbar+8+(bodyHeight-16-size-88)/2;
      region(device,'bar',8,0,W-16,56,`${icon('house','Home')}<span class="icons">${icon('refresh-cw','New game')}${icon('ellipsis-vertical','Share and export')}</span>`);
      region(device,'player',8,top,col,44,player(false,'4:18'));
      region(device,'board-region',bx,top+44,size,size,'<div class="board" role="img" aria-label="Same chess position"></div>');
      region(device,'player active',8,top+44+size,col,44,player(true,'4:42'));
      const sx=8+col+12,sw=W-sx-8;
      region(device,'moves',sx,toolbar+8,sw,40,moves);
      region(device,'controls',sx,H-8-56,sw,56,controls());
    }else{
      const pad=16,gap=24,size=H-pad*2,sx=pad+size+gap,sw=W-sx-pad;
      region(device,'board-region',pad,pad,size,size,'<div class="board" role="img" aria-label="Same chess position"></div>');
      region(device,'bar',sx,pad,sw,48,`<span class="icons">${icon('house','Home')}<span class="status">5 + 3</span></span><span class="icons">${icon('refresh-cw','New game')}${icon('ellipsis-vertical','Share and export')}</span>`);
      region(device,'player',sx,pad+58,sw,tablet?68:54,player(false,'4:18'));
      if(tablet){
        const rows=[['6.','Re1','b5'],['7.','Bb3','d6'],['8.','c3','O-O'],['9.','h3','Nb8'],['10.','d4','Nbd7']];
        region(device,'move-list',sx,pad+148,sw,H-354,rows.map((r,i)=>`<span class="number">${r[0]}</span><span>${r[1]}</span><span class="${i===4?'chosen':''}">${r[2]}</span>`).join(''));
      }else region(device,'moves',sx,156,sw,48,moves);
      region(device,'status',sx,H-170,sw,24,'Your turn');
      region(device,'player active',sx,H-(tablet?144:128),sw,tablet?68:54,player(true,'4:42'));
      region(device,'controls',sx,H-64,sw,48,controls());
    }
    const gesture=document.createElement('div');gesture.className='gesture';device.appendChild(gesture);
  });
  function render(){
    root.style.colorScheme=state.appearance==='System'?'light dark':state.appearance.toLowerCase();
    root.querySelectorAll('.board').forEach(el=>{
      const order=Array.from({length:64},(_,i)=>state.orientation==='White'?i:63-i);
      el.innerHTML=order.map(i=>{const piece=position[i],file=i%8,rank=8-Math.floor(i/8),sq=String.fromCharCode(97+file)+rank,key=piece?(piece===piece.toUpperCase()?'w':'b')+piece.toUpperCase():'';return `<span class="sq ${(Math.floor(i/8)+file)%2?'dark':''} ${['b8','d7'].includes(sq)?'last':''}">${piece?`<img src="${pieces[key]}" alt="${key} on ${sq}">`:''}</span>`;}).join('');
    });
  }
  render();
  globalThis.lucide?.createIcons({attrs:{width:15,height:15}});
  if(globalThis.Tweak){
    const t=new Tweak({container:root,onChange:()=>{render();window.openai?.setWidgetState?.({modelContent:{landscapeComparison:{...state}},privateContent:null})?.catch(()=>{});}});
    t.addSelect(state,'orientation',{label:'Board orientation',options:['White','Black']});
    t.addSelect(state,'appearance',{label:'Appearance',options:['System','Dark','Light']});
  }
  window.addEventListener('openai:set_globals',event=>{applySaved(event.detail?.globals?.widgetState?.modelContent?.landscapeComparison);render();});
})();
</script>
